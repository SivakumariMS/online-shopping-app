<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online shopping</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      *{
        margin: 0;
        padding: 0;
      }
      .online-shopping{
        max-width: 800px;
        background-color: rgb(255, 255, 255);
        margin: auto;
        padding: 10px;
        border-radius: 5px;
        margin-top: 5px;
      }
      body{
        background-color: rgb(214, 217, 217);
      }
      .product-row{
        border: 1px solid black;
        margin-bottom: 5px;
        border-radius: 5px;
        padding: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      span{
        margin-left: 5px;
      }
      button{
        background-color: blue;
        color: white;
        border-radius: 5px;
        padding: 5px 10px ;
      }
      button:hover{
        background-color: rgb(23, 23, 122);
      }
      #feedback{
        position: fixed;
        right: 20px;
        top:15px;
        background-color: green;
        color: white;
        display: none;
      }
      #totalPrice{
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="online-shopping">
      <h1 style="text-align: center;">Online Shopping</h1>
      <h3>Available Products</h3>
       <p id="feedback"> Feedback</p>
      <div id="productsContainer"> </div>
      <div>
        <h3>My cart</h3>
        <div id="cartContainer"></div>
        <h3 id="totalPrice"></h3>
      </div>
      <div>
        <h6>Actions</h6>
        <button class="btn btn-primary" id="sortCartByPrice">Sort by price</button>
         <button class="btn btn-primary" id="clearCart">Clear Cart</button>
      </div> 
    </div>
    <script src="script.js"></script>
  </body>
</html>
